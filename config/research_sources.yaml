    priority: high
  - id: businessline
    name: The Hindu BusinessLine Markets
    category: news
    url: https://www.thehindubusinessline.com/markets/
    access: licensed_api_or_permitted_feed
    priority: medium
  - id: financial_express
    name: Financial Express Markets
    category: news
    url: https://www.financialexpress.com/market/
    access: licensed_api_or_permitted_feed
    priority: medium
  - id: sebi
    name: SEBI
    category: regulation
    url: https://www.sebi.gov.in/
