    priority: high
  - id: moneycontrol
    name: Moneycontrol Markets
    category: news
    url: https://www.moneycontrol.com/news/business/markets/
    access: licensed_api_or_permitted_feed
    priority: high
  - id: livemint
    name: Mint Markets
    category: news
